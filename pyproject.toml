[project]
name = "kiyooo"
version = "0.1.0"
description = "Open-source, AI-triaged Attack Surface Management platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "sqlalchemy[asyncio]>=2.0.35",
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.2",
    "typer>=0.12.5",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
    "redis>=5.0.8",
    "httpx>=0.27.2",
    "rich>=13.8.1",
    "minio>=7.2.9",
    "boto3>=1.35.0",
    "pgvector>=0.3.6",
    "pyopenssl>=24.0.0",
    "jinja2>=3.1.4",
    "arq>=0.26.1",
    "prometheus-client>=0.21.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
]

[project.scripts]
kiyooo = "kiyooo.cli:app"
kiyoo-cli = "kiyooo.cli_quick:app"

[dependency-groups]
dev = [
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "types-pyyaml>=6.0.12",
    "aiosqlite>=0.20.0",
    "boto3-stubs[ec2,elbv2,s3,cloudfront,sts]>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiyooo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Query", "fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "kiyooo.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
