# Stage 12 — a fake org, planted to exercise real shipped
# categories (and, just as importantly, their false-positive paths).
# Everything here binds to 127.0.0.1 only — this lab is meant to run
# entirely offline on one laptop, never on a real network. See
# labs/acmecorp/README.md before running `make lab-up`.

name: acmecorp

services:
  # exposed-database (critical TP) — MySQL bound to the host with no TLS,
  # default creds. A real service, not a mock — kiyooo's port_in +
  # service_banner_matches predicates fire against its real banner.
  mysql-exposed:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: acmecorp-demo-only
      MYSQL_DATABASE: customers
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # exposed-nonprod-to-internet (TP, downgraded to medium by seeded-data
  # detection) — a staging app with a debug header and obviously-fake
  # customer data, so the triage step demonstrates the fixture-data
  # downgrade the design's category triage_hints calls for.
  staging-app:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./content/staging-app:/usr/share/nginx/html:ro
      - ./nginx-conf/staging-app.conf:/etc/nginx/conf.d/default.conf:ro

  # exposed-inference-endpoint (critical TP) — real Ollama, no model
  # pulled (this lab never sends an inference request; reachability +
  # the "Ollama is running" banner is the whole finding).
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"

  # exposed-cloud-storage (TP) — MinIO with a public bucket seeded by
  # seed/seed-minio.sh, holding one planted invoice.pdf. Ports 9500/9501,
  # not 9000/9001 — kiyooo's own docker-compose.yml (its evidence-store
  # MinIO) already uses those, and both stacks run at once during a demo.
  minio-public:
    image: minio/minio:latest
    command: server /data --console-address ":9501"
    environment:
      MINIO_ROOT_USER: acmecorp-admin
      MINIO_ROOT_PASSWORD: acmecorp-demo-only
    ports:
      - "127.0.0.1:9500:9000"
      - "127.0.0.1:9501:9501"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # leaked-secret / leaked-ai-api-key (TP, redaction path) — a "leaked"
  # .env file with a placeholder-shaped-but-realistic Anthropic key.
  # kiyooo's normalize/redact.py redacts it before it ever reaches
  # content_hash or a ticket — the demo point is showing the [REDACTED:...]
  # placeholder in the finding, never the live-looking value on screen.
  leaky-secret-app:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./content/leaky-secret-app:/usr/share/nginx/html:ro
      - ./nginx-conf/leaky-secret-app.conf:/etc/nginx/conf.d/default.conf:ro

  # expired-cert (critical TP, clustering demo) — one self-signed,
  # deliberately-expired cert shared by 40 vhosts. Stage 4's fingerprint
  # rule clusters all 40 hostnames into one cluster_id (same cert
  # serial) — 40 findings, 1 ticket.
  expired-cert-app:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx-conf/expired-cert-app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

  # exposed-admin-panel, correctly suppressed by the sso_gateway control
  # (a real 302 redirect chain to a login.microsoftonline.com-shaped URL —
  # never a real Microsoft endpoint, just the redirect Location header
  # kiyooo's redirect_chain_matches predicate reads).
  sso-admin-panel:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8083:80"
    volumes:
      - ./nginx-conf/sso-admin-panel.conf:/etc/nginx/conf.d/default.conf:ro

  # generic-web-cve, severity-reduced-not-suppressed by cloudflare_waf —
  # see nginx-conf/waf-app.conf's own note on nuclei template dependence.
  waf-app:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8084:80"
    volumes:
      - ./nginx-conf/waf-app.conf:/etc/nginx/conf.d/default.conf:ro

  # One-shot: creates a public bucket and drops the planted invoice.pdf
  # in it, then exits. `make lab-up` waits for this to finish before
  # calling the lab "ready" — see the Makefile.
  minio-seed:
    image: minio/mc:latest
    depends_on:
      minio-public:
        condition: service_healthy
    volumes:
      - ./seed/invoice.pdf:/seed/invoice.pdf:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio-public:9000 acmecorp-admin acmecorp-demo-only &&
      mc mb -p local/customer-invoices &&
      mc anonymous set public local/customer-invoices &&
      mc cp /seed/invoice.pdf local/customer-invoices/invoice.pdf &&
      echo 'minio-seed: done'
      "

volumes:
  minio-data:
