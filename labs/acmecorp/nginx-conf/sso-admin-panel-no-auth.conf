# The "drift" variant labs/scenarios/dev-exposes-prod.sh swaps in — the
# SSO redirect is gone, /admin now serves the panel directly. Same shape
# exposed-admin-panel.yaml's own detect block looks for
# (http_body_matches: "admin login|...|control panel|...").
server {
    listen 80;
    server_name admin.acmecorp.lab;

    location = / {
        return 200 "acmecorp admin — see /admin\n";
    }

    location = /admin {
        return 200 "<html><title>Acmecorp Control Panel</title><body><h1>Control Panel</h1><p>No authentication configured.</p></body></html>\n";
    }
}
