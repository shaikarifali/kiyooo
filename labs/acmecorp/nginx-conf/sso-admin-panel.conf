server {
    listen 80;
    server_name admin.acmecorp.lab;

    location = / {
        return 200 "acmecorp admin — see /admin\n";
    }

    # Real 302 redirect chain to an SSO-shaped URL (never a real Microsoft
    # endpoint — nothing here actually contacts login.microsoftonline.com,
    # this is just the Location header kiyooo's recon adapter records).
    # See labs/acmecorp/README.md for why this asset's exact triage
    # outcome depends on how the redirect chain is recorded, and should
    # be rehearsed before a live demo.
    location = /admin {
        return 302 https://login.microsoftonline.com/acmecorp-demo-tenant/oauth2/v2.0/authorize;
    }
}
