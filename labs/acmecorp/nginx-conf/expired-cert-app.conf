# 40 vhosts (app01..app40.acmecorp.lab), one shared expired cert
# (labs/acmecorp/seed/gen_expired_cert.py). All 40 findings should
# collapse into one cluster_id / one ticket — that's the demo.
server {
    listen 443 ssl;
    server_name app01.acmecorp.lab app02.acmecorp.lab app03.acmecorp.lab
                app04.acmecorp.lab app05.acmecorp.lab app06.acmecorp.lab
                app07.acmecorp.lab app08.acmecorp.lab app09.acmecorp.lab
                app10.acmecorp.lab app11.acmecorp.lab app12.acmecorp.lab
                app13.acmecorp.lab app14.acmecorp.lab app15.acmecorp.lab
                app16.acmecorp.lab app17.acmecorp.lab app18.acmecorp.lab
                app19.acmecorp.lab app20.acmecorp.lab app21.acmecorp.lab
                app22.acmecorp.lab app23.acmecorp.lab app24.acmecorp.lab
                app25.acmecorp.lab app26.acmecorp.lab app27.acmecorp.lab
                app28.acmecorp.lab app29.acmecorp.lab app30.acmecorp.lab
                app31.acmecorp.lab app32.acmecorp.lab app33.acmecorp.lab
                app34.acmecorp.lab app35.acmecorp.lab app36.acmecorp.lab
                app37.acmecorp.lab app38.acmecorp.lab app39.acmecorp.lab
                app40.acmecorp.lab;

    ssl_certificate /etc/nginx/certs/expired.crt;
    ssl_certificate_key /etc/nginx/certs/expired.key;

    # weak-tls-version, same vhost as the expired cert on purpose — a
    # neglected host usually has both problems at once. Explicit here
    # because nginx:alpine's compiled default is TLSv1.2+; this opts
    # back into the deprecated versions the category detects.
    # NOTE (honesty note, same as this lab's README): not run against a
    # live container in this session (no Docker daemon here) — the
    # OpenSSL build in nginx:alpine may enforce a @SECLEVEL that refuses
    # TLSv1/1.1 regardless of this directive. Verify with
    # `openssl s_client -connect app01.acmecorp.lab:8443 -tls1_1` once
    # the lab is actually running; if it fails, that's a real gap to
    # come back and fix, not this comment being wrong.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

    location / {
        return 200 "acmecorp internal app\n";
    }
}
