# generic-web-cve + cloudflare_waf control demo. cf-ray simulates a
# Cloudflare-fronted app (the control's own detect: http_header_matches
# cf-ray); the /search endpoint echoes a SQL-error-shaped body so a real
# nuclei run's generic sqli-error-detection templates have something to
# match against. Whether your installed nuclei template set actually fires
# here depends on your template versions — rehearse this one specifically
# (labs/acmecorp/README.md's honesty note applies most to this asset).
server {
    listen 80;
    server_name waf.acmecorp.lab;

    add_header cf-ray "8f2a1b3c4d5e6f70-SJC" always;

    location = / {
        return 200 "acmecorp search\n";
    }

    location = /search {
        default_type text/html;
        return 200 "<html><body>Warning: mysql_fetch_array() expects parameter 1 to be resource, boolean given in /var/www/search.php on line 42<br>You have an error in your SQL syntax; check the manual that corresponds to your MySQL server version</body></html>\n";
    }
}
