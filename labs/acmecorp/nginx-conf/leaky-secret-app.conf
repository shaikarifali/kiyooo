server {
    listen 80;
    server_name leak.acmecorp.lab;

    location = / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # The planted finding — served here, sourced from a file that isn't
    # literally named .env (see planted-dotenv.txt's own comment).
    location = /.env {
        alias /usr/share/nginx/html/planted-dotenv.txt;
        default_type text/plain;
    }
}
