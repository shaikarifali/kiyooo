should_match:
  - name: high-entropy token in body
    asset: { type: http_service, value: "https://app.acmecorp.example/bundle.js" }
    evidence:
      - kind: http_response
        content:
          body: "const apiKey = 'aK9fQ2mZ7xW4nR8pL1vC6tY3sJ0gH5dB8kM2wX9uV4rT7pS1nQ6zL3fD8jH2mA5cE9gI4kO7bN0';"

should_not_match:
  - name: low-entropy, repetitive body
    asset: { type: http_service, value: "https://app.acmecorp.example/" }
    evidence:
      - kind: http_response
        content:
          body: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
