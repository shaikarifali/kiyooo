should_match:
  - name: resource tagged as a mobile_static ingest finding
    asset: { type: mobile_app, value: "/data/apks/acmecorp-android-2.3.apk" }
    evidence:
      - kind: cloud_config
        content: { tags: { kiyooo.ingest_source: mobile_static } }

should_not_match:
  - name: resource with no ingest-source tag
    asset: { type: mobile_app, value: "/data/apks/other-app-1.0.apk" }
    evidence:
      - kind: cloud_config
        content: { tags: { environment: "prod" } }
