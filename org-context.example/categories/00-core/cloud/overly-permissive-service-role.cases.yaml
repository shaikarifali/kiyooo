should_match:
  - name: resource tagged as a Prowler ingest finding
    asset: { type: cloud_resource, value: "arn:aws:iam::123456789012:instance-profile/web-admin" }
    evidence:
      - kind: cloud_config
        content: { tags: { kiyooo.ingest_source: prowler } }

should_not_match:
  - name: resource with no ingest-source tag
    asset: { type: cloud_resource, value: "arn:aws:iam::123456789012:instance-profile/batch-scoped" }
    evidence:
      - kind: cloud_config
        content: { tags: { environment: "prod" } }
