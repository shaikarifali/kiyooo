should_match:
  - name: resource tagged as a Prowler ingest finding
    asset: { type: cloud_resource, value: "vol-0123456789abcdef0" }
    evidence:
      - kind: cloud_config
        content: { tags: { kiyooo.ingest_source: prowler } }

should_not_match:
  - name: resource with no ingest-source tag
    asset: { type: cloud_resource, value: "vol-0fedcba9876543210" }
    evidence:
      - kind: cloud_config
        content: { tags: { environment: "prod" } }
