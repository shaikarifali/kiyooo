should_match:
  - name: resource tagged as a Prowler ingest finding
    asset: { type: cloud_resource, value: "arn:aws:s3:::acme-uploads-prod" }
    evidence:
      - kind: cloud_config
        content: { tags: { kiyooo.ingest_source: prowler } }

should_not_match:
  - name: resource with no ingest-source tag
    asset: { type: cloud_resource, value: "arn:aws:s3:::acme-internal-logs" }
    evidence:
      - kind: cloud_config
        content: { tags: { environment: "prod" } }
