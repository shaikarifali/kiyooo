id: leaked-secret
name: High-entropy secret exposed in a public HTTP response
version: 1
enabled: true
severity_base: critical

applies_to:
  - http_service

detect:
  all_of:
    - internet_reachable: true
    - body_entropy_above: 4.5

evidence_required:
  - http_response

triage_hints: >
  A high-entropy substring in a public response body is the classic
  signature of a leaked API key, token, or credential embedded in a JS
  bundle, config file, or debug page — but entropy alone produces false
  positives on minified code, hashes used as cache-busting query params, and
  base64-encoded images. Before escalating, confirm the matched string looks
  like a credential shape (a known provider's key prefix, an obvious
  variable name like `api_key`/`secret`/`token` nearby) rather than assuming
  entropy alone proves a secret. If the string is a live, working credential
  (not a placeholder, fixture, or already-rotated value), this is critical
  regardless of what it's a credential for — an org's own secret being
  public is the finding, independent of blast radius.

always_escalate: true
escalation_threshold: 0.75
# The evidence *is* a live credential — sending it to a hosted provider
# would hand a third party the very secret this finding is about.
redaction_profile: local_only

route:
  assign_to: appsec
  cc: []
  notify_channels: ["#appsec-triage"]
  sla_days:
    critical: 1
    high: 2
    medium: 14
    low: 30
    info: 90
