should_match:
  - name: api subdomain, json response, no auth challenge
    asset: { type: http_service, value: "https://api.acmecorp.example" }
    evidence:
      - kind: http_response
        content: { status_code: 200, header: { "content-type": "application/json" } }

should_not_match:
  - name: api subdomain, auth-gated
    asset: { type: http_service, value: "https://api.acmecorp.example" }
    evidence:
      - kind: http_response
        content: { status_code: 403, header: {} }
