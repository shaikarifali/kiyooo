should_match:
  - name: resource tagged as a TruffleHog ingest finding
    asset: { type: repo, value: "https://github.com/acmecorp/internal-api" }
    evidence:
      - kind: cloud_config
        content: { tags: { kiyooo.ingest_source: trufflehog } }

should_not_match:
  - name: resource with no ingest-source tag
    asset: { type: repo, value: "https://github.com/acmecorp/public-docs" }
    evidence:
      - kind: cloud_config
        content: { tags: { environment: "prod" } }
