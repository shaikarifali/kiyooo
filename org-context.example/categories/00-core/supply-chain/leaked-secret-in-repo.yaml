id: leaked-secret-in-repo
name: Verified live credential committed to a source repository
version: 1
enabled: true
is_sensitive_target: true  # holds/grants access to data or credentials — Stage 17 attack-path endpoint
finding_granularity: one_per_vendor_finding  # many distinct vendor findings can share this category+asset; see config.py
severity_base: critical

applies_to:
  - repo

# This category's findings arrive exclusively via Stage 15's
# TruffleHog ingest path (`ingest/pipeline.py::ingest_finding`), which never
# calls `detect/engine.py` — TruffleHog's `--only-verified` flag already
# confirmed the credential is live against its actual provider before this
# finding was even created. This `detect` block is a structural placeholder
# to satisfy `CategoryDefinition`'s schema, same pattern as Stage 13/14.
detect:
  any_of:
    - cloud_tag_equals: { kiyooo.ingest_source: trufflehog }

evidence_required:
  - external_finding

# The evidence describes a currently-live credential. Sending it to a
# hosted LLM provider would hand a third party the very secret this
# finding is about — same reasoning as the recon-path `leaked-secret`
# category already applies.
redaction_profile: local_only

triage_hints: >
  TruffleHog only reports a finding here after confirming the credential
  still works against its actual provider (AWS STS, GitHub's API, Stripe,
  etc.) — this is not a pattern match, it is a confirmed-live secret. Do
  not re-verify it yourself (invariant #1: no exploitation, and re-checking
  a live credential is itself a use of it). The evidence's `detector_name`
  tells you what kind of credential this is; escalate the org's own
  rotation/revocation process immediately regardless of the specific
  provider — every hour this is live is exposure. Check `commit`/`file` to
  see whether this is in the repo's current HEAD (still reachable by anyone
  who clones today) or only in history (still a problem — git history is
  not deleted by a later commit — but the remediation path differs:
  history rewrite plus rotation, not just rotation).

always_escalate: true
escalation_threshold: 0.95

route:
  assign_to: appsec
  cc: [platform-eng]
  notify_channels: ["#appsec-triage", "#platform-eng"]
  sla_days:
    critical: 1
    high: 1
    medium: 7
    low: 30
    info: 90
