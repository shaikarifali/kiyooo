id: root-container
name: Container runs as root with no runAsNonRoot constraint
version: 1
enabled: true
finding_granularity: one_per_vendor_finding  # many distinct vendor findings can share this category+asset; see config.py
severity_base: medium

applies_to:
  - k8s_workload
  - container_image

detect:
  any_of:
    - cloud_tag_equals: { kiyooo.ingest_source: trivy }

evidence_required:
  - external_finding

triage_hints: >
  Running as root is medium on its own — a defense-in-depth gap, not an
  active compromise path. It escalates sharply in combination with another
  finding on the same workload: paired with a known container-escape CVE
  (check for a co-occurring `vulnerable-base-image` finding referencing a
  kernel or container-runtime CVE on the same asset) root access inside the
  container becomes root on the host. Check for that pairing before
  finalizing severity rather than scoring this finding in isolation.

always_escalate: false
escalation_threshold: 0.6

route:
  assign_to: platform-eng
  cc: []
  notify_channels: ["#platform-eng"]
  sla_days:
    critical: 7
    high: 14
    medium: 30
    low: 60
    info: 90
