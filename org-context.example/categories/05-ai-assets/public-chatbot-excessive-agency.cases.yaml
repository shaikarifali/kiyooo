should_match:
  - name: open webui signature
    asset: { type: http_service, value: "http://10.0.0.9/" }
    evidence:
      - kind: http_response
        content: { body: "Open WebUI" }
  - name: flowise signature
    asset: { type: http_service, value: "http://10.0.0.9:3000/" }
    evidence:
      - kind: http_response
        content: { body: "Flowise - Build AI Agents" }

should_not_match:
  - name: ordinary marketing site
    asset: { type: http_service, value: "http://10.0.0.9/" }
    evidence:
      - kind: http_response
        content: { body: "<html><body>Welcome to our site</body></html>" }
