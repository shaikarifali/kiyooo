services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kiyooo
      POSTGRES_PASSWORD: kiyooo
      POSTGRES_DB: kiyooo
    ports:
      - "5432:5432"
    volumes:
      - kiyooo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiyooo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kiyooo
      MINIO_ROOT_PASSWORD: kiyooo-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kiyooo_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kiyooo_postgres_data:
  kiyooo_minio_data:
